server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name carmageddon.xedoc.ru;

    root /var/www/carmageddon.xedoc.ru;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/carmageddon.xedoc.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carmageddon.xedoc.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /multiplayer {
        proxy_pass http://127.0.0.1:3041;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 70s;
        proxy_send_timeout 70s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

server {
    listen 80;
    listen [::]:80;
    server_name carmageddon.xedoc.ru;
    return 301 https://$host$request_uri;
}
